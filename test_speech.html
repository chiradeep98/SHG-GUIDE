<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Hindi Speech Recognition Test</title>
</head>
<body>
  <h2>Hindi Speech Recognition Test</h2>
  <button id="btn">Start Speaking</button>
  <p>Status: <span id="status">idle</span></p>
  <p>Transcript:</p>
  <p id="output" style="font-size: 20px; border: 1px solid #ccc; padding: 10px; min-height: 30px;"></p>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('status').textContent = 'Speech Recognition not supported in this browser. Use Chrome.';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      const btn = document.getElementById('btn');
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');

      btn.addEventListener('click', () => {
        outputEl.textContent = '';
        statusEl.textContent = 'listening...';
        recognition.start();
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        outputEl.textContent = transcript;
        statusEl.textContent = 'done';
      };

      recognition.onerror = (event) => {
        statusEl.textContent = 'error: ' + event.error;
      };

      recognition.onend = () => {
        if (statusEl.textContent === 'listening...') {
          statusEl.textContent = 'stopped (no speech detected?)';
        }
      };
    }
  </script>
</body>
</html>
